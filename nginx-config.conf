# =====================================================
# Configuração Nginx - API BB Sistema de Boletos
# =====================================================
# Copiar para: /etc/nginx/sites-available/api-bb
# Criar symlink: ln -s /etc/nginx/sites-available/api-bb /etc/nginx/sites-enabled/

# Backend API - api-bb.seudominio.com
server {
    listen 80;
    server_name api-bb.seudominio.com;

    # Redirecionar HTTP para HTTPS (após configurar SSL)
    # return 301 https://$server_name$request_uri;

    # Logs
    access_log /var/log/nginx/api-bb-access.log;
    error_log /var/log/nginx/api-bb-error.log;

    # Proxy para o backend Node.js (porta 3001)
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts para requisições longas (geração de PDFs)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Aumentar tamanho máximo de upload (para PDFs de faturas)
    client_max_body_size 50M;
}

# Frontend React - bb.seudominio.com
server {
    listen 80;
    server_name bb.seudominio.com;

    # Redirecionar HTTP para HTTPS (após configurar SSL)
    # return 301 https://$server_name$request_uri;

    # Logs
    access_log /var/log/nginx/bb-frontend-access.log;
    error_log /var/log/nginx/bb-frontend-error.log;

    # Diretório do build do React
    root /var/www/api-bb/build;
    index index.html;

    # Servir arquivos estáticos do React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Desabilitar cache para index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Aumentar tamanho máximo de upload
    client_max_body_size 50M;
}

